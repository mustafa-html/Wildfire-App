services:
  - type: web
    name: respira-canada-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEFAULT_REGION
        value: AB
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
